name: Setup Xcode and SPM cache
description: Read Xcode version from Config/toolchain.plist, configure Xcode, and cache SwiftPM repositories.

inputs:
  spm-cache-prefix:
    description: Prefix for the SwiftPM cache key (e.g. spm or nightly-spm).
    required: true

outputs:
  version:
    description: Resolved Xcode version from Config/toolchain.plist.
    value: ${{ steps.xcode_config.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read Xcode version
      id: xcode_config
      shell: bash
      run: |
        set -euo pipefail
        version="$(python3 scripts/read-xcode-version.py)"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: ${{ steps.xcode_config.outputs.version }}

    - name: Cache SPM repositories
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: ${{ inputs.spm-cache-prefix }}-${{ runner.os }}-xcode-${{ steps.xcode_config.outputs.version }}-${{ hashFiles('LocalTranscriber.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
