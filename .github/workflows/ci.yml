name: CI

# Supply-chain hardening: only the repository checkout is needed to publish
# artifacts and run tests.
permissions:
  contents: read

# push + pull_request both fire for same-repo PRs, which doubled macOS jobs
# and queued runners for ~30 minutes when many PRs landed together.
# Keep pull_request for branches; run push CI only on main.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# PRs share a group so newer pushes cancel stale runs. main uses run_id so
# concurrent merges are not skipped: GitHub keeps only one pending run per
# group even when cancel-in-progress is false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read Syft version
        id: syft_config
        run: |
          set -euo pipefail
          chmod +x ./scripts/generate-sbom.sh
          version="$(./scripts/generate-sbom.sh --print SyftVersion)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ steps.syft_config.outputs.version }}

      - name: Generate SBOM
        id: sbom
        run: |
          set -euo pipefail
          sbom_path="$(./scripts/generate-sbom.sh --mode ci)"
          artifact_name="$(./scripts/generate-sbom.sh --print CIArtifactName)"
          retention_days="$(./scripts/generate-sbom.sh --print CIArtifactRetentionDays)"
          echo "sbom_path=${sbom_path}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "retention_days=${retention_days}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.sbom.outputs.artifact_name }}
          path: build/sbom/
          retention-days: ${{ steps.sbom.outputs.retention_days }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck scripts/*.sh scripts/*.command

      - name: Python syntax check
        run: |
          python3 -m py_compile scripts/generate_xcodeproj.py

  readme-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify README version matches MARKETING_VERSION
        run: |
          python3 scripts/verify-readme-version.py

  site-js-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Site JavaScript tests
        run: |
          cd site
          node app.test.js

      - name: Release script tests
        run: |
          bash scripts/test-release-scripts.sh

  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      XCODE_VERSION: '16.4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache SPM repositories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('LocalTranscriber.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # The cache whitelists DerivedData subdirectories needed for incremental
      # builds (paths kept literal; actions/cache inputs are safest without
      # expression expansion). Measured on the runner (uncompressed):
      # ModuleCache.noindex ~215MB, SourcePackages ~189MB, Build ~154MB,
      # Index.noindex ~45MB; the zstd-compressed entry is ~253MB, far below the
      # 10GB per-repository cache quota. GitHub evicts least-recently-used
      # entries automatically, so per-run snapshots cannot accumulate without
      # bound. Excluded from the cache: Logs, TestResults, CompilationCache,
      # SDKStatCaches (rebuildable, low value).
      #
      # restore/save are split (instead of a single actions/cache@v4) because the
      # cache must be saved even when "Run tests" fails: partially compiled
      # intermediates still speed up the next run, which retry-fix pushes depend on.
      # actions/cache@v4 without `save-always` does not save in that case.
      # The primary key embeds github.run_id because actions/cache cannot overwrite
      # an existing key; each run saves a new snapshot, and restore-keys (prefix
      # without run_id) restores the latest snapshot from any previous run.
      - name: Restore DerivedData cache
        id: derived_data_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            DerivedData/Build
            DerivedData/SourcePackages
            DerivedData/ModuleCache.noindex
            DerivedData/Index.noindex
          key: dd-${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('LocalTranscriber.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            dd-${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('LocalTranscriber.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LocalTranscriber.xcodeproj \
            -scheme LocalTranscriber \
            -derivedDataPath DerivedData

      - name: Verify Package.resolved is committed
        run: |
          RESOLVED="LocalTranscriber.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ ! -f "$RESOLVED" ]; then
            echo "Package.resolved not found at $RESOLVED"
            exit 1
          fi
          if ! git diff --quiet -- "$RESOLVED"; then
            echo "Package.resolved is out of date. Run xcodebuild -resolvePackageDependencies and commit the result."
            git diff -- "$RESOLVED"
            exit 1
          fi

      - name: Run tests
        run: |
          xcodebuild test \
            -project LocalTranscriber.xcodeproj \
            -scheme LocalTranscriber \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath DerivedData \
            -skip-testing:LocalTranscriberTests/ModelDownloadIntegrationTests \
            -skip-testing:LocalTranscriberUITests \
            -skip-testing:LocalTranscriberTests/ModelAvailabilityPathTests/testWhisperKitLoadsFromDetectedModelFolder

      # Save with the run_id-scoped primary key only when this run did not restore
      # that exact key (a cache-hit on the primary key means the entry already exists).
      - name: Swift format check
        run: |
          chmod +x ./scripts/check-swift-format.sh
          ./scripts/check-swift-format.sh

      - name: Save DerivedData cache
        if: always() && steps.derived_data_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            DerivedData/Build
            DerivedData/SourcePackages
            DerivedData/ModuleCache.noindex
            DerivedData/Index.noindex
          key: ${{ steps.derived_data_cache.outputs.cache-primary-key }}
