name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LocalTranscriber.xcodeproj \
            -scheme LocalTranscriber \
            -derivedDataPath DerivedData

      - name: Verify Package.resolved is committed
        run: |
          RESOLVED="LocalTranscriber.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ ! -f "$RESOLVED" ]; then
            echo "Package.resolved not found at $RESOLVED"
            exit 1
          fi
          if ! git diff --quiet -- "$RESOLVED"; then
            echo "Package.resolved is out of date. Run xcodebuild -resolvePackageDependencies and commit the result."
            git diff -- "$RESOLVED"
            exit 1
          fi

      - name: Install Syft
        run: |
          set -euo pipefail
          SYFT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :SyftVersion' Config/sbom.plist)"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"

      - name: Generate SBOM
        id: sbom
        run: |
          set -euo pipefail
          chmod +x ./scripts/generate-sbom.sh
          sbom_path="$(./scripts/generate-sbom.sh --mode ci)"
          artifact_name="$(/usr/libexec/PlistBuddy -c 'Print :CIArtifactName' Config/sbom.plist)"
          retention_days="$(/usr/libexec/PlistBuddy -c 'Print :CIArtifactRetentionDays' Config/sbom.plist)"
          echo "sbom_path=${sbom_path}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "retention_days=${retention_days}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sbom.outputs.artifact_name }}
          path: build/sbom/
          retention-days: ${{ steps.sbom.outputs.retention_days }}

      - name: Run tests
        run: |
          xcodebuild test \
            -project LocalTranscriber.xcodeproj \
            -scheme LocalTranscriber \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath DerivedData \
            -skip-testing:LocalTranscriberTests/ModelDownloadIntegrationTests \
            -skip-testing:LocalTranscriberTests/ModelAvailabilityPathTests/testWhisperKitLoadsFromDetectedModelFolder
