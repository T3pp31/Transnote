name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0). Defaults to the pushed tag.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  XCODE_VERSION: '16.4'
  SCHEME: LocalTranscriber
  PROJECT: LocalTranscriber.xcodeproj
  DERIVED_DATA_PATH: DerivedData
  RELEASE_APP_DIR: build/release

jobs:
  release:
    runs-on: macos-15
    env:
      # Share only availability flags; raw credentials belong to their consuming steps.
      HAS_SIGNING_SECRETS: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD != '' && secrets.MACOS_CERTIFICATE_IDENTITY != '' }}
      HAS_NOTARIZATION_SECRETS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Read distribution config
        run: |
          set -euo pipefail
          app_name="$(/usr/libexec/PlistBuddy -c 'Print :AppName' Config/distribution.plist)"
          if [[ -z "$app_name" || "$app_name" == *$'\n'* || "$app_name" == *$'\r'* ]]; then
            echo "AppName must be a non-empty single-line value." >&2
            exit 1
          fi
          printf 'APP_NAME=%s\nARCHIVE_PATH=build/%s.xcarchive\n' "$app_name" "$app_name" >> "$GITHUB_ENV"

      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$RELEASE_VERSION_INPUT"
            if [ -z "$raw" ]; then
              echo "workflow_dispatch requires the version input (e.g. v0.1.0)." >&2
              exit 1
            fi
          else
            raw="${GITHUB_REF_NAME}"
          fi
          version="${raw#v}"
          if [ -z "$version" ]; then
            echo "Could not determine release version." >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "Release version contains unsupported characters." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Sync MARKETING_VERSION
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./scripts/set-marketing-version.sh
          ./scripts/set-marketing-version.sh "$RELEASE_VERSION"

      - name: Run tests
        run: |
          bash scripts/run-tests.sh release

      - name: Run real-model tests (release gate)
        timeout-minutes: 120
        env:
          RUN_MODEL_INTEGRATION_TESTS: '1'
        run: |
          set -euo pipefail
          # Validate selectors separately so one passing suite cannot hide an
          # unmatched selector or a test skipped by its environment guard.
          for TEST_IDENTIFIER in \
            LocalTranscriberTests/ModelDownloadIntegrationTests \
            LocalTranscriberTests/ModelAvailabilityPathTests/testWhisperKitLoadsFromDetectedModelFolder
          do
            RESULT_BUNDLE="$DERIVED_DATA_PATH/TestResults/ReleaseModelTests-${TEST_IDENTIFIER##*/}.xcresult"
            rm -rf "$RESULT_BUNDLE"
            xcodebuild test \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -resultBundlePath "$RESULT_BUNDLE" \
              "-only-testing:$TEST_IDENTIFIER"

            summary="$(xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --compact)"
            total="$(echo "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["totalTestCount"])')"
            executed="$(echo "$summary" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(sum(item["passedTests"] + item["failedTests"] + item["expectedFailures"] for item in data["devicesAndConfigurations"]))')"
            echo "Executed tests for $TEST_IDENTIFIER: $executed (total: $total)"
            if [[ "$total" -eq 0 || "$executed" -eq 0 ]]; then
              echo "FAIL: release real-model tests did not execute for $TEST_IDENTIFIER" >&2
              exit 1
            fi
          done

      - name: Archive Release build
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_PATH"
          xcodebuild archive \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}"

      - name: Export app
        run: |
          set -euo pipefail
          rm -rf "${{ env.RELEASE_APP_DIR }}"
          ./scripts/export-release-app.sh \
            --archive "$ARCHIVE_PATH" \
            --output "${{ env.RELEASE_APP_DIR }}"

      - name: Sign app with Developer ID
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          CERTIFICATE_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          APP_PATH="${RELEASE_APP_DIR}/${APP_NAME}.app"
          /usr/bin/codesign --force --deep --options runtime \
            --entitlements "${{ github.workspace }}/LocalTranscriber/LocalTranscriber.entitlements" \
            --sign "$CERTIFICATE_IDENTITY" "$APP_PATH"
          /usr/bin/codesign -d --entitlements :- "$APP_PATH" | grep -q 'com.apple.security.app-sandbox'
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Notarize app
        if: ${{ env.HAS_NOTARIZATION_SECRETS == 'true' && env.SIGNED == '1' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH="${RELEASE_APP_DIR}/${APP_NAME}.app"
          ZIP_PATH="$RUNNER_TEMP/${APP_NAME}-signed.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH"             --apple-id "$APPLE_ID"             --password "$APPLE_ID_PASSWORD"             --team-id "$APPLE_TEAM_ID"             --wait
          xcrun stapler staple "$APP_PATH"
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Read Syft version
        id: syft_config
        run: |
          set -euo pipefail
          chmod +x ./scripts/generate-sbom.sh
          version="$(./scripts/generate-sbom.sh --print SyftVersion)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ steps.syft_config.outputs.version }}

      - name: Generate SBOM
        id: sbom
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/generate-sbom.sh
          sbom_path="$(./scripts/generate-sbom.sh \
            --mode release \
            --version "$RELEASE_VERSION")"
          echo "sbom_path=${sbom_path}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/create-dmg.sh \
            --app "${RELEASE_APP_DIR}/${APP_NAME}.app" \
            --version "$RELEASE_VERSION" \
            --output build/dist
          versioned_dmg="build/dist/${APP_NAME}-$RELEASE_VERSION.dmg"
          latest_dmg="build/dist/${APP_NAME}.dmg"
          cp "$versioned_dmg" "$latest_dmg"
          echo "dmg_path=$versioned_dmg" >> "$GITHUB_OUTPUT"
          echo "latest_dmg_path=$latest_dmg" >> "$GITHUB_OUTPUT"
          echo "versioned_dmg_name=${APP_NAME}-$RELEASE_VERSION.dmg" >> "$GITHUB_OUTPUT"
          echo "latest_dmg_name=${APP_NAME}.dmg" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 checksums
        id: checksum
        run: |
          set -euo pipefail
          versioned_dmg="${{ steps.dmg.outputs.dmg_path }}"
          latest_dmg="${{ steps.dmg.outputs.latest_dmg_path }}"
          versioned_sha256="${versioned_dmg}.sha256"
          latest_sha256="${latest_dmg}.sha256"
          (cd "$(dirname "$versioned_dmg")" && shasum -a 256 "$(basename "$versioned_dmg")" > "$(basename "$versioned_sha256")")
          (cd "$(dirname "$latest_dmg")" && shasum -a 256 "$(basename "$latest_dmg")" > "$(basename "$latest_sha256")")
          versioned_hash="$(awk '{print $1}' "$versioned_sha256")"
          latest_hash="$(awk '{print $1}' "$latest_sha256")"
          echo "versioned_sha256_path=$versioned_sha256" >> "$GITHUB_OUTPUT"
          echo "latest_sha256_path=$latest_sha256" >> "$GITHUB_OUTPUT"
          echo "versioned_hash=$versioned_hash" >> "$GITHUB_OUTPUT"
          echo "latest_hash=$latest_hash" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          if [[ "${NOTARIZED:-0}" == "1" ]]; then
            security_notice="Developer ID で署名・公証済みのビルドです。"
            signature_note="このビルドは Developer ID で署名・公証済みです。"
          elif [[ "${SIGNED:-0}" == "1" ]]; then
            security_notice="Developer ID で署名済みのビルドです。公証は行われていません。"
            signature_note="このビルドは Developer ID で署名済みです。公証には Apple ID 等の secrets 設定が必要です。"
          else
            security_notice="**⚠️ 初回起動時に「マルウェア」という警告が出ても、これはマルウェアではありません。** ${APP_NAME} は Apple の有料開発者認証（署名）をせずに配布しているため、macOS の Gatekeeper が「マルウェアでないことを確認できない」と表示します。未署名アプリ共通の安全確認の通知で、ウイルス検出ではありません。「完了」で閉じて進んでください（「ゴミ箱に入れる」は押さないでください）。"
            signature_note="現時点では未署名ビルドを配布しています。Developer ID 署名と Notarization には [Apple Developer Program](https://developer.apple.com/programs/) への加入と CI 用証明書の設定が必要です（将来対応予定）。"
          fi

          cat > release_body.md <<EOF
          $security_notice

          ※ この案内は **${APP_NAME} について**のものです。他のアプリで同様の警告が出たときは、そのアプリの配布元が信頼できるか必ず確認してください。

          DMG と **${APP_NAME}.dmg.sha256** の両方をダウンロードし、同じフォルダに保存してから **インストール.command** を実行してください（旧バージョンは自動的に置き換えられます）。

          ## SHA256 チェックサム

          ダウンロード後、インストール前に整合性を確認してください。

          | ファイル | SHA256 |
          | --- | --- |
          | \`${{ steps.dmg.outputs.versioned_dmg_name }}\` | \`${{ steps.checksum.outputs.versioned_hash }}\` |
          | \`${{ steps.dmg.outputs.latest_dmg_name }}\` | \`${{ steps.checksum.outputs.latest_hash }}\` |

          \`.sha256\` ファイルも Release 資産として同梱しています。

          \`\`\`bash
          shasum -a 256 -c ${{ steps.dmg.outputs.versioned_dmg_name }}.sha256
          \`\`\`

          詳細は [インストール手順](https://github.com/T3pp31/Transnote/blob/main/docs/install.md) を参照してください。

          > **コード署名について**: $signature_note
          EOF

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.dmg.outputs.latest_dmg_path }}
          subject-name: ${{ env.APP_NAME }}
          show-summary: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.APP_NAME }} ${{ steps.version.outputs.version }}
          body_path: release_body.md
          generate_release_notes: true
          files: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.dmg.outputs.latest_dmg_path }}
            ${{ steps.checksum.outputs.versioned_sha256_path }}
            ${{ steps.checksum.outputs.latest_sha256_path }}
            ${{ steps.sbom.outputs.sbom_path }}
