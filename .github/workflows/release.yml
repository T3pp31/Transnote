name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0). Defaults to the pushed tag.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  SCHEME: LocalTranscriber
  PROJECT: LocalTranscriber.xcodeproj
  DERIVED_DATA_PATH: DerivedData
  RELEASE_APP_DIR: build/release

jobs:
  release:
    runs-on: macos-15
    env:
      # Share only availability flags; raw credentials belong to their consuming steps.
      HAS_SIGNING_SECRETS: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD != '' && secrets.MACOS_CERTIFICATE_IDENTITY != '' }}
      HAS_NOTARIZATION_SECRETS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      # バージョンの正規化・検証はこの1ステップに集約し、checkout 前に実行する。
      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$RELEASE_VERSION_INPUT"
            if [ -z "$raw" ]; then
              echo "workflow_dispatch requires the version input (e.g. v0.1.0)." >&2
              exit 1
            fi
          else
            raw="${GITHUB_REF_NAME}"
          fi
          version="${raw#v}"
          if [ -z "$version" ]; then
            echo "Could not determine release version." >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "Release version contains unsupported characters." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.tag || github.ref }}

      - name: Verify release commit is on main
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.tag || github.ref }}
        run: |
          set -euo pipefail
          # 未レビューのコミットを署名秘密情報付きで実行しないよう、main の祖先に限定する。
          # 同名タグで解決されないよう、リモート追跡ブランチを完全修飾 ref で指定する。
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          head_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$head_sha" refs/remotes/origin/main; then
            echo "Release ref $RELEASE_REF ($head_sha) must be an ancestor of main." >&2
            exit 1
          fi

      - name: Read Xcode version
        id: xcode_config
        run: |
          set -euo pipefail
          version="$(python3 scripts/read-xcode-version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.xcode_config.outputs.version }}

      - name: Read distribution config
        run: |
          set -euo pipefail
          app_name="$(/usr/libexec/PlistBuddy -c 'Print :AppName' Config/distribution.plist)"
          if [[ -z "$app_name" || "$app_name" == *$'\n'* || "$app_name" == *$'\r'* ]]; then
            echo "AppName must be a non-empty single-line value." >&2
            exit 1
          fi
          # AppName は DMG 名・Release 本文へ展開されるため、シェルメタ文字を拒否する。
          if ! [[ "$app_name" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "AppName must contain only alphanumerics, '.', '_' or '-'." >&2
            exit 1
          fi
          printf 'APP_NAME=%s\nARCHIVE_PATH=build/%s.xcarchive\n' "$app_name" "$app_name" >> "$GITHUB_ENV"

      - name: Sync MARKETING_VERSION
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./scripts/set-marketing-version.sh
          ./scripts/set-marketing-version.sh "$RELEASE_VERSION"

      - name: Run tests
        run: |
          bash scripts/run-tests.sh release

      - name: Run real-model tests (release gate)
        timeout-minutes: 120
        env:
          RUN_MODEL_INTEGRATION_TESTS: '1'
          TEST_RUNNER_RUN_MODEL_INTEGRATION_TESTS: '1'
          GATE_NAME: release
        run: |
          set -euo pipefail
          bash scripts/run-model-integration-tests.sh

      - name: Archive Release build
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_PATH"
          xcodebuild archive \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}"

      - name: Export app
        run: |
          set -euo pipefail
          rm -rf "${{ env.RELEASE_APP_DIR }}"
          ./scripts/export-release-app.sh \
            --archive "$ARCHIVE_PATH" \
            --output "${{ env.RELEASE_APP_DIR }}"

      - name: Sign app with Developer ID
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          CERTIFICATE_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_IDENTITY }}
        run: |
          set -euo pipefail
          source ./scripts/release-signing-keychain.sh
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          # 後続ステップはチェックアウトした ref 内のスクリプトを実行するため、
          # 成否にかかわらず Developer ID 秘密鍵を保持したキーチェーンを残さない。
          trap 'cleanup_signing_keychain "$KEYCHAIN" "$CERT_PATH"' EXIT
          setup_signing_keychain "$KEYCHAIN" "$CERT_PATH"
          APP_PATH="${RELEASE_APP_DIR}/${APP_NAME}.app"
          /usr/bin/codesign --force --deep --options runtime \
            --entitlements "${{ github.workspace }}/LocalTranscriber/LocalTranscriber.entitlements" \
            --sign "$CERTIFICATE_IDENTITY" "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          /usr/bin/codesign -d --entitlements :- "$APP_PATH" | grep -q 'com.apple.security.app-sandbox'
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Notarize app
        if: ${{ env.HAS_NOTARIZATION_SECRETS == 'true' && env.SIGNED == '1' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH="${RELEASE_APP_DIR}/${APP_NAME}.app"
          ZIP_PATH="$RUNNER_TEMP/${APP_NAME}-signed.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH"             --apple-id "$APPLE_ID"             --password "$APPLE_ID_PASSWORD"             --team-id "$APPLE_TEAM_ID"             --wait
          xcrun stapler staple "$APP_PATH"
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Read Syft version
        id: syft_config
        run: |
          set -euo pipefail
          chmod +x ./scripts/generate-sbom.sh
          version="$(./scripts/generate-sbom.sh --print SyftVersion)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ steps.syft_config.outputs.version }}

      - name: Generate SBOM
        id: sbom
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/generate-sbom.sh
          sbom_path="$(./scripts/generate-sbom.sh \
            --mode release \
            --version "$RELEASE_VERSION")"
          echo "sbom_path=${sbom_path}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/create-dmg.sh \
            --app "${RELEASE_APP_DIR}/${APP_NAME}.app" \
            --version "$RELEASE_VERSION" \
            --output build/dist
          versioned_dmg="build/dist/${APP_NAME}-$RELEASE_VERSION.dmg"
          latest_dmg="build/dist/${APP_NAME}.dmg"
          cp "$versioned_dmg" "$latest_dmg"
          echo "dmg_path=$versioned_dmg" >> "$GITHUB_OUTPUT"
          echo "latest_dmg_path=$latest_dmg" >> "$GITHUB_OUTPUT"
          echo "versioned_dmg_name=${APP_NAME}-$RELEASE_VERSION.dmg" >> "$GITHUB_OUTPUT"
          echo "latest_dmg_name=${APP_NAME}.dmg" >> "$GITHUB_OUTPUT"

      - name: Sign DMG with Developer ID
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' && env.SIGNED == '1' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          CERTIFICATE_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_IDENTITY }}
          VERSIONED_DMG: ${{ steps.dmg.outputs.dmg_path }}
          LATEST_DMG: ${{ steps.dmg.outputs.latest_dmg_path }}
        run: |
          set -euo pipefail
          source ./scripts/release-signing-keychain.sh
          KEYCHAIN="$RUNNER_TEMP/dmg-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dmg-certificate.p12"
          trap 'cleanup_signing_keychain "$KEYCHAIN" "$CERT_PATH"' EXIT
          setup_signing_keychain "$KEYCHAIN" "$CERT_PATH"
          /usr/bin/codesign --force --sign "$CERTIFICATE_IDENTITY" "$VERSIONED_DMG"
          /usr/bin/codesign --verify --verbose=2 "$VERSIONED_DMG"
          cp "$VERSIONED_DMG" "$LATEST_DMG"

      - name: Notarize DMG
        if: ${{ env.HAS_NOTARIZATION_SECRETS == 'true' && env.SIGNED == '1' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSIONED_DMG: ${{ steps.dmg.outputs.dmg_path }}
          LATEST_DMG: ${{ steps.dmg.outputs.latest_dmg_path }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$VERSIONED_DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$VERSIONED_DMG"
          xcrun stapler validate "$VERSIONED_DMG"
          cp "$VERSIONED_DMG" "$LATEST_DMG"

      - name: Compute SHA256 checksums
        id: checksum
        env:
          VERSIONED_DMG: ${{ steps.dmg.outputs.dmg_path }}
          LATEST_DMG: ${{ steps.dmg.outputs.latest_dmg_path }}
        run: |
          set -euo pipefail
          versioned_dmg="$VERSIONED_DMG"
          latest_dmg="$LATEST_DMG"
          versioned_sha256="${versioned_dmg}.sha256"
          latest_sha256="${latest_dmg}.sha256"
          (cd "$(dirname "$versioned_dmg")" && shasum -a 256 "$(basename "$versioned_dmg")" > "$(basename "$versioned_sha256")")
          (cd "$(dirname "$latest_dmg")" && shasum -a 256 "$(basename "$latest_dmg")" > "$(basename "$latest_sha256")")
          versioned_hash="$(awk '{print $1}' "$versioned_sha256")"
          latest_hash="$(awk '{print $1}' "$latest_sha256")"
          echo "versioned_sha256_path=$versioned_sha256" >> "$GITHUB_OUTPUT"
          echo "latest_sha256_path=$latest_sha256" >> "$GITHUB_OUTPUT"
          echo "versioned_hash=$versioned_hash" >> "$GITHUB_OUTPUT"
          echo "latest_hash=$latest_hash" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        env:
          VERSIONED_DMG_NAME: ${{ steps.dmg.outputs.versioned_dmg_name }}
          LATEST_DMG_NAME: ${{ steps.dmg.outputs.latest_dmg_name }}
          VERSIONED_HASH: ${{ steps.checksum.outputs.versioned_hash }}
          LATEST_HASH: ${{ steps.checksum.outputs.latest_hash }}
        run: |
          set -euo pipefail
          source ./scripts/release-security-notice.sh

          # 値は env 経由で受け取り、変数展開だけを行う（コマンド置換は実行しない）。
          cat > release_body.md <<EOF
          $security_notice

          ※ この案内は **${APP_NAME} について**のものです。他のアプリで同様の警告が出たときは、そのアプリの配布元が信頼できるか必ず確認してください。

          DMG と **${APP_NAME}.dmg.sha256** の両方をダウンロードし、同じフォルダに保存してから **インストール.command** を実行してください（旧バージョンは自動的に置き換えられます）。

          ## SHA256 チェックサム

          ダウンロード後、インストール前に整合性を確認してください。

          | ファイル | SHA256 |
          | --- | --- |
          | \`${VERSIONED_DMG_NAME}\` | \`${VERSIONED_HASH}\` |
          | \`${LATEST_DMG_NAME}\` | \`${LATEST_HASH}\` |

          \`.sha256\` ファイルも Release 資産として同梱しています。

          \`\`\`bash
          shasum -a 256 -c ${VERSIONED_DMG_NAME}.sha256
          \`\`\`

          詳細は [インストール手順](https://github.com/T3pp31/Transnote/blob/main/docs/install.md) を参照してください。

          > **コード署名について**: $signature_note
          EOF

      - name: Attest build provenance
        uses: actions/attest-build-provenance@1c608116169c793ddc0eb38d7a8e36f9653b99d1 # v1.4.3
        with:
          subject-path: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.dmg.outputs.latest_dmg_path }}
          subject-name: ${{ env.APP_NAME }}
          show-summary: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.APP_NAME }} ${{ steps.version.outputs.version }}
          body_path: release_body.md
          generate_release_notes: true
          files: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.dmg.outputs.latest_dmg_path }}
            ${{ steps.checksum.outputs.versioned_sha256_path }}
            ${{ steps.checksum.outputs.latest_sha256_path }}
            ${{ steps.sbom.outputs.sbom_path }}
