name: Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  whisperkit-model-tests:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read Xcode version
        id: xcode_config
        run: |
          set -euo pipefail
          version="$(python3 scripts/read-xcode-version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ steps.xcode_config.outputs.version }}

      - name: Cache SPM repositories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: nightly-spm-${{ runner.os }}-xcode-${{ steps.xcode_config.outputs.version }}-${{ hashFiles('LocalTranscriber.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LocalTranscriber.xcodeproj \
            -scheme LocalTranscriber \
            -derivedDataPath DerivedData

      - name: Run real-model tests (normally skipped)
        env:
          RUN_MODEL_INTEGRATION_TESTS: '1'
          TEST_RUNNER_RUN_MODEL_INTEGRATION_TESTS: '1'
          GATE_NAME: nightly
        run: |
          set -euo pipefail
          bash scripts/run-model-integration-tests.sh
