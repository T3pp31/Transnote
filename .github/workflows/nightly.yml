name: Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  whisperkit-model-tests:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      XCODE_VERSION: '16.4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache SPM repositories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: nightly-spm-${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('LocalTranscriber.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LocalTranscriber.xcodeproj \
            -scheme LocalTranscriber \
            -derivedDataPath DerivedData

      - name: Run real-model tests (normally skipped)
        env:
          RUN_MODEL_INTEGRATION_TESTS: '1'
          TEST_RUNNER_RUN_MODEL_INTEGRATION_TESTS: '1'
        run: |
          # Validate each selector in isolation: an unmatched -only-testing is
          # silently ignored and must not be masked by the other selector.
          for TEST_IDENTIFIER in \
            LocalTranscriberTests/ModelDownloadIntegrationTests \
            LocalTranscriberTests/ModelAvailabilityPathTests/testWhisperKitLoadsFromDetectedModelFolder
          do
            RESULT_BUNDLE="DerivedData/TestResults/NightlyModelTests-${TEST_IDENTIFIER##*/}.xcresult"
            rm -rf "$RESULT_BUNDLE"
            xcodebuild test \
              -project LocalTranscriber.xcodeproj \
              -scheme LocalTranscriber \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO \
              -derivedDataPath DerivedData \
              -resultBundlePath "$RESULT_BUNDLE" \
              "-only-testing:$TEST_IDENTIFIER"

            summary="$(xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --compact)"
            total="$(echo "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["totalTestCount"])')"
            executed="$(echo "$summary" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(sum(item["passedTests"] + item["failedTests"] + item["expectedFailures"] for item in data["devicesAndConfigurations"]))')"
            echo "Executed tests for $TEST_IDENTIFIER: $executed (total: $total)"
            if [[ "$total" -eq 0 || "$executed" -eq 0 ]]; then
              echo "FAIL: nightly real-model tests did not execute for $TEST_IDENTIFIER" >&2
              exit 1
            fi
          done
