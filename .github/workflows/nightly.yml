name: Nightly

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  whisperkit-model-tests:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      XCODE_VERSION: '16.4'
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache SPM repositories
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: nightly-spm-${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('LocalTranscriber.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LocalTranscriber.xcodeproj \
            -scheme LocalTranscriber \
            -derivedDataPath DerivedData

      - name: Run real-model tests (normally skipped)
        run: |
          xcodebuild test \
            -project LocalTranscriber.xcodeproj \
            -scheme LocalTranscriber \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath DerivedData \
            -only-testing:LocalTranscriberTests/ModelDownloadIntegrationTests \
            -only-testing:LocalTranscriberTests/ModelAvailabilityPathTests/testWhisperKitLoadsFromDetectedModelFolder
