name: Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  whisperkit-model-tests:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Xcode and SPM cache
        id: xcode_config
        uses: ./.github/actions/setup-xcode-spm
        with:
          spm-cache-prefix: nightly-spm

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LocalTranscriber.xcodeproj \
            -scheme LocalTranscriber \
            -derivedDataPath DerivedData

      - name: Run real-model tests (normally skipped)
        env:
          RUN_MODEL_INTEGRATION_TESTS: '1'
          TEST_RUNNER_RUN_MODEL_INTEGRATION_TESTS: '1'
          GATE_NAME: nightly
        run: |
          set -euo pipefail
          bash scripts/run-model-integration-tests.sh
