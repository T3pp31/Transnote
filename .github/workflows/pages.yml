name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'Config/github-config.json'
      - 'scripts/generate-site-config.py'
      - 'Transnote.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify site config is up to date
        run: |
          python3 scripts/generate-site-config.py --check

      - name: Prepare site assets
        run: cp Transnote.png site/Transnote.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
